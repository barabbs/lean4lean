# Builds and publishes the lean4lean blueprint (blueprint/, see its
# README.md): validates the blueprint's declaration claims against the built
# Lean project, builds the leanblueprint web output, best-effort builds
# doc-gen4 API docs, and deploys web + docs to GitHub Pages. The PDF is
# deliberately NOT built in CI -- build it locally, see blueprint/README.md.
# This does not use leanblueprint's stock docgen-action: its `blueprint: true`
# path always runs `lake exe checkdecls`, which needs a lakefile dependency
# this project deliberately does not carry (see blueprint/README.md's
# Validation section) -- `validate` below does the equivalent checks itself.
# See blueprint/README.md's "Continuous integration" section for the
# resulting site layout and the one-time repository settings this needs.
name: Compile blueprint

on:
  push:
    branches: [blueprint] # the branch that currently carries blueprint/
  pull_request:
    paths:
      - "blueprint/**"
      - ".github/workflows/blueprint.yml"
  # Only takes effect once this file exists on the default branch (master).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds the Lean project, validates the blueprint's declarations against
  # it, and (best effort) builds the doc-gen4 API docs -- all in one job so
  # the Lean project is built once, not twice.
  validate:
    name: Build Lean project, validate blueprint, API docs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Safe to cancel: a stale run's build cache has no downstream consumer.
    concurrency:
      group: ${{ github.workflow }}-validate-${{ github.ref }}
      cancel-in-progress: true
    env:
      # tools/run_census.sh and the python checkers below all default to
      # <repo>/.blueprint-work when this is unset; pinned here so every step
      # is provably reading/writing the same directory.
      BLUEPRINT_WORK: ${{ github.workspace }}/.blueprint-work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          use-mathlib-cache: false

      # Not default targets; tools/run_census.sh and the docbuild step below
      # both need them.
      - name: Build Lean4Lean.Tests and Lean4Lean.Experimental
        run: lake build Lean4Lean.Tests Lean4Lean.Experimental

      - name: Rebuild the declaration census
        run: blueprint/tools/run_census.sh

      - name: Rebuild the chapter/label registry
        run: python3 blueprint/tools/rebuild_registry.py

      - name: Check chapters against the census
        run: python3 blueprint/tools/check_chapter.py blueprint/src/chapters/*.tex

      - name: Check cross-chapter references
        run: python3 blueprint/tools/check_global.py

      # Best-effort API docs so the blueprint's \lean{} links resolve: a
      # standard doc-gen4 "docbuild" nested Lake project (doc-gen4 README,
      # "Usage"). continue-on-error here (plus the `if` guards below) means a
      # failure never fails this job or blocks `deploy`.
      - name: Generate API docs via a docbuild nested project
        id: docbuild
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p docbuild
          cat > docbuild/lakefile.toml <<'EOF'
          name = "docbuild"
          reservoir = false
          version = "0.1.0"
          packagesDir = "../.lake/packages"

          [[require]]
          scope = "leanprover"
          name = "doc-gen4"
          rev = "v4.33.0-rc2"

          [[require]]
          name = "lean4lean"
          path = "../"
          EOF
          cd docbuild
          lake update lean4lean
          lake build Lean4Lean:docs Lean4Lean.Theory:docs Lean4Lean.Verify:docs Lean4Lean.Tests:docs Lean4Lean.Experimental:docs

      - name: Stage API docs for the Pages site
        if: steps.docbuild.outcome == 'success'
        run: |
          mkdir -p out/docs
          cp -r docbuild/.lake/build/doc/. out/docs/

      - name: Upload API docs artifact
        if: steps.docbuild.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-docs
          path: out
          if-no-files-found: error

  # Builds the leanblueprint web output only (no PDF). Independent of
  # `validate`, so it runs in parallel.
  web:
    name: Build blueprint (web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Safe to cancel: a stale run's web output has no downstream consumer.
    concurrency:
      group: ${{ github.workflow }}-web-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # texlive-base is needed even without a PDF: plasTeX locates every \input
      # file through the `kpsewhich` binary, and without it silently builds an
      # empty document.
      - name: Install kpsewhich, graphviz and Python build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-base \
            graphviz libgraphviz-dev pkg-config \
            python3-venv python3-dev build-essential
          kpsewhich --version | head -1

      - name: Install leanblueprint into a venv
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install leanblueprint

      - name: Build blueprint web
        run: leanblueprint web

      # plasTeX exits 0 on an empty document; refuse to publish one.
      - name: Check the web output is not empty
        run: |
          test "$(ls blueprint/web/chap-*.html | wc -l)" -ge 18
          test "$(stat -c %s blueprint/web/dep_graph_document.html)" -gt 100000

      - name: Upload blueprint-web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blueprint-web
          path: blueprint/web
          if-no-files-found: error

  # Assembles the web blueprint + API docs into one Pages site and deploys
  # it. `api-docs` may not exist (best effort in `validate`); a missing
  # site/docs/ just means the \lean{} links 404 for this deployment.
  deploy:
    name: Assemble and deploy the Pages site
    needs: [validate, web]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same group/setting as GitHub's own Pages-deploy starter workflow: a
    # second deploy queues behind an in-progress one instead of canceling it.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The web blueprint's own index.html becomes the site root.
      - name: Download blueprint web
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blueprint-web
          path: site

      - name: Download API docs (best effort)
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-docs
          path: site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
