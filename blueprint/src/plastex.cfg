[general]
renderer=HTML5
copy-theme-extras=yes
plugins=plastexdepgraph plastexshowmore leanblueprint

[document]
# Chapters + sections in the global table of contents; going deeper is
# unreadable with ~950 nodes spread over 18 chapters.
toc-depth=2
toc-non-files=True

[files]
directory=../web/
# 0 = one html file per chapter.
split-level=0

[html5]
# Per-page local table of contents listing the sections of that chapter.
localtoc-level=1
extra-css=extra_styles.css
mathjax-dollars=False
